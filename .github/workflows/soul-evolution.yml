name: Soul Evolution smoke
on:
  push:
    branches: [main, feature/soul-evolution-background]
  pull_request:
    branches: [main]
jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 parse and memory tests
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\test-soul-evolution.ps1
      - name: Soul 3.0 persistence and logic tests
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\\test-soul3.ps1
      - name: Soul Curiosity persistence and logic tests
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\test-soul-curiosity.ps1
      - name: Soul Understanding logic tests
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\test-soul-understanding.ps1
      - name: Soul Depth logic tests
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\test-soul-depth.ps1
      - name: Local API request guard tests
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\test-local-request.ps1
      - name: Background worker optimistic commits
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\\test-background.ps1
      - name: Memory evidence persistence
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\\test-provenance.ps1
      - name: Browser bundle source parity
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\\build-site.ps1 -Check
      - name: Browser JavaScript syntax
        shell: cmd
        run: node tests\check-site.js
